name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare for static export
        run: |
          if [ -f "src/middleware.ts" ]; then
            mv src/middleware.ts src/middleware.ts.bak
          fi

      - name: Build for GitHub Pages
        run: pnpm run build:github-pages
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_DEPLOYMENT_ENV: github-pages
          NEXT_PUBLIC_BASE_URL: https://menteeno.ir
          NEXT_PUBLIC_API_URL: https://menteeno.ir/api
          NEXT_PUBLIC_DEFAULT_LOCALE: fa
          NEXT_PUBLIC_APP_NAME: Menteeno
          NEXT_PUBLIC_APP_DESCRIPTION: پلتفرم توسعه مهارت‌های حرفه‌ای
          NEXT_PUBLIC_GA_ID: G-ELCJW5JXCB
          NEXT_PUBLIC_GTM_ID: GTM-5FDNSG37
          NEXT_PUBLIC_HOTJAR_ID: "2342900"
          NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY: QgGRgZEwmnWiJS453Ahh

      - name: Restore middleware
        if: always()
        run: |
          if [ -f "src/middleware.ts.bak" ]; then
            mv src/middleware.ts.bak src/middleware.ts
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
